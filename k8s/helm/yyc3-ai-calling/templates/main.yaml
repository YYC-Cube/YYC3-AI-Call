apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yyc3-ai-calling.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
    helm.sh/chart: {{ include "yyc3-ai-calling.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: yyc3-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "yyc3-ai-calling.fullname" . }}-config
            - secretRef:
                name: {{ include "yyc3-ai-calling.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "yyc3-ai-calling.fullname" . }}-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yyc3-ai-calling.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "yyc3-ai-calling.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "yyc3-ai-calling.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "yyc3-ai-calling.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "yyc3-ai-calling.fullname" . }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yyc3-ai-calling.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  NODE_ENV: "{{ .Values.env.NODE_ENV }}"
  PORT: "{{ .Values.service.port }}"
  LOG_LEVEL: "{{ .Values.logging.level }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yyc3-ai-calling.fullname" . }}-uploads
  labels:
    app.kubernetes.io/name: {{ include "yyc3-ai-calling.name" . }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
