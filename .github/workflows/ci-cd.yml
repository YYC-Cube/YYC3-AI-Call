# ============================================
# YYC³ AI Calling - 容器镜像构建与漏洞扫描
#
# 定位：仅负责「可运行的部署产物」，不重复 ci.yml 的质量门禁。
# 触发：版本标签 v* 与手动触发（K8s/Helm 集群由运维侧仓库外执行）。
# 说明：
#   - 已移除原本不可达的 K8s 部署 / Slack 通知 / 镜像清理阶段
#     （secrets KUBE_CONFIG_* 与 SLACK_WEBHOOK_* 未配置，必然失败）
#   - 已移除重复的 lint/test 与 20 分钟挂死的服务等待
#     （ubuntu runner 无 redis-cli，until 循环永不结束）
# ============================================

name: Container Image (Build & Scan)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    name: 🐳 Build & Scan Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1

      # 按 digest 扫描（多标签时 tags 为多行，digest 唯一且不可变）
      - name: Scan image for vulnerabilities (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.txt
          retention-days: 7
          if-no-files-found: ignore
