name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify CNAME for custom domain
        run: |
          echo "🔍 Verifying CNAME configuration..."
          if [ ! -f "public/CNAME" ]; then
            echo "❌ ERROR: public/CNAME not found!"
            exit 1
          fi
          echo "✅ CNAME content:"
          cat public/CNAME
          echo ""
          echo "📡 Custom domain: ai-call.yyc3.vip"

      - name: Build static site
        run: pnpm build
        env:
          NEXT_STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify build output
        run: |
          echo "🔍 Verifying build output..."
          if [ ! -d "out" ]; then
            echo "❌ ERROR: out/ directory not found!"
            exit 1
          fi
          FILE_COUNT=$(find out -type f | wc -l)
          echo "✅ Build successful: $FILE_COUNT files generated"
          echo ""
          echo "📋 Key files:"
          ls -la out/ | head -20
          if [ -f "out/CNAME" ]; then
            echo ""
            echo "✅ CNAME included in build:"
            cat out/CNAME
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Domain** | https://ai-call.yyc3.vip |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 [Live Site](https://ai-call.yyc3.vip)" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [GitHub Pages](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY
