# ============================================
# YYC³ AI Intelligent Calling - Docker Compose
# 多容器编排：应用 + 数据库 + 缓存 + 消息队列
# ============================================

version: '3.8'

services:
  # --------------------------------------------
  # 主应用服务
  # --------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yyc3-ai-calling-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://yyc3:yyc3_password@postgres:5432/yyc3_ai_calling?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QWEN_LLM_BASE_URL=http://ollama:11434
      - QWEN_EMBEDDING_BASE_URL=http://ollama:11434
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # --------------------------------------------
  # PostgreSQL数据库
  # --------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: yyc3-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yyc3
      POSTGRES_PASSWORD: yyc3_password
      POSTGRES_DB: yyc3_ai_calling
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyc3 -d yyc3_ai_calling"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # --------------------------------------------
  # Redis缓存（会话、速率限制等）
  # --------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: yyc3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --------------------------------------------
  # Ollama本地AI模型服务（可选）
  # --------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: yyc3-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - yyc3-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    profiles:
      - ai-local

  # --------------------------------------------
  # Nginx反向代理（生产环境）
  # --------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: yyc3-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - yyc3-network
    profiles:
      - production

# ============================================
# 网络配置
# ============================================
networks:
  yyc3-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# 持久化卷
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  nginx_logs:
    driver: local
